lidar_water_projection:
  ros__parameters:
    lidar_topic: /lidar_aft/points
    # Must be a TF frame with vertical +Z; water lies at water_level_m.
    water_frame: ma2_water_plane_up
    water_level_m: 0.0
    min_height_m: 0.0
    # Exclusive upper limit: keep heights strictly less than 2 metres.
    max_height_m: 2.0
    sector_width_deg: 2.0
    min_sector_points: 2
    range_cluster_m: 1.0
    min_range_m: 1.0
    max_range_m: 150.0
    max_segment_m: 20.0
