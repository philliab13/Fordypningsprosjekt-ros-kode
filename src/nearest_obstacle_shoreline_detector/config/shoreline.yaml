nearest_obstacle_shoreline_detector:
  ros__parameters:
    input_mode: standalone
    # Footprint source images carry the exact timestamps used for boat masks.
    left_topic: /obstacles/source_image
    depth_topic: /ma2/zed/depth
    sync_slop_s: 0.03
    sync_queue_size: 20
    boat_mask_topic: /obstacles/boat_mask
    # Zero derives height from camera TF above water_level_m.
    camera_height_m: 0.0
    reset_gap_s: 1.0
    # Log elapsed wall time for every processed image pair.
    log_timing: true
    # Retain the last valid barrier through empty results and input gaps.
    hold_last_boundary: true
    # Empty paths use the config and weights installed with this ROS package.
    fastsam_weights: ''
    rwps_config: ''
    remove_boats: true
    retina_masks: false
    water_mask_topic: /stixel_free_space/validated_water_mask
    camera_info_topic: /ma2/zed/camera_info
    lidar_topic: /lidar_aft/points
    # shoreline.launch.py flips the existing MA2 water frame to Z up.
    water_frame: ma2_water_plane_up
    # Stationary TF frame for motion compensation between sensor timestamps.
    fixed_frame: piren
    water_level_m: 0.0
    column_width_px: 10
    bottom_margin_px: 50
    boundary_band_px: 30.0
    min_points: 2
    depth_cluster_m: 1.0
    max_range_m: 100.0
    max_segment_m: 3.0
    lidar_max_skew_s: 0.10
    cloud_buffer_size: 300
    input_timeout_s: 5.0
    marker_width_m: 0.15
